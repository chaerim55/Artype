<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ARTYPE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ecf0;--sf:#fff;--tx:#15161a;--mu:#737780;--ac:#3b4eff;--ln:#dfe3e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sf:#25262b;--tx:#f2f3f5;--mu:#a3a7b0;--ln:#3c3e46}}
:root[data-theme="dark"]{--sf:#25262b;--tx:#f2f3f5;--mu:#a3a7b0;--ln:#3c3e46}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Noto Sans KR",sans-serif;color:var(--tx);overflow:hidden;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none;z-index:5}
.pill{pointer-events:auto;background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:700}
#rt:empty{display:none}
#dock{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);display:none;gap:8px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:12px;font-size:14px;line-height:1.4;z-index:5}
#dock b{flex:1;font-weight:500}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;min-height:48px}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}
#sheet{position:fixed;inset:0;display:none;align-items:flex-end;background:#0006;z-index:20}
#sheet>div,#res{width:100%;max-height:84vh;overflow:auto;background:var(--sf);border-radius:26px 26px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 84px);animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
h2{font-size:19px;margin:0 0 12px;line-height:1.45;font-weight:900}
.o{display:block;width:100%;text-align:left;background:transparent;border:1.5px solid var(--ln);border-radius:14px;padding:14px;margin:0 0 8px;font-size:15px;min-height:48px}
.o.on{border-color:var(--ac);background:#3b4eff1c}
.row{display:flex;gap:8px}.row .btn,.row .o{flex:1;margin:0;text-align:center}
img.big{width:100%;max-height:42vh;object-fit:contain;border-radius:12px;background:#0001;margin-bottom:12px}
small,.mu{color:var(--mu)}
#start{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 34px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);pointer-events:none;z-index:4}
#start>*{pointer-events:auto}
.lo{font-size:44px;font-weight:900;letter-spacing:-.04em}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:14px}
.cd .row{margin-bottom:10px}
#fade{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}#fade.f{opacity:1}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:50;display:none}
#tk,#stp{position:fixed;left:50%;top:38%;z-index:40;display:none;transform:translate(-50%,-50%);text-align:center}
#tk{background:var(--sf);border:2px dashed var(--ac);border-radius:16px;padding:20px 28px;font-size:15px;animation:pop 1.3s both}
#stp{font-size:34px;font-weight:900;color:var(--ac);border:4px solid var(--ac);border-radius:12px;padding:8px 18px;animation:pop 1s both}
@keyframes pop{0%{transform:translate(-50%,40%) scale(.4) rotate(-8deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1) rotate(-3deg);opacity:1}80%{opacity:1}100%{opacity:0}}
#res{position:fixed;bottom:0;left:0;height:66vh;display:none;z-index:10}
.bar{height:8px;border-radius:4px;background:var(--ac)}
.ex{border:1.5px dashed var(--ln);border-radius:16px;padding:14px;margin:0 0 10px;font-size:14px;line-height:1.55}
.ex b{font-size:16px}.dm{font-size:11px;background:var(--ln);border-radius:6px;padding:2px 6px;margin-left:6px}
.th{display:flex;gap:8px;margin:8px 0 14px}.th img{width:0;flex:1;aspect-ratio:1;object-fit:cover;border-radius:10px}
a{color:var(--ac)}
#tool{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:none;z-index:25;background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:5px}
#tool button{background:none;border:0;border-radius:99px;padding:8px 20px;font-size:14px;font-weight:700;min-height:44px}
#tool.on button{background:var(--ac);color:#fff}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><button class="pill" id="bk">‹ 이전</button><span class="pill" id="rt"></span></div>
<div id="start"><div><div class="lo">ARTYPE</div><div style="font-size:17px;font-weight:700;margin-top:6px">당신의 취향을 발견하는 작은 미술관</div><small>Welcome to ARTYPE</small></div>
<div class="cd"><div class="row"><button class="o on" data-a="g" data-v="m">👦 남자</button><button class="o" data-a="g" data-v="f">👧 여자</button></div><button class="btn" data-a="go" style="width:100%">입장하기</button></div></div>
<div id="dock"><b id="dt"></b><button class="btn" data-a="nx">다음</button></div>
<div id="tool"><button data-a="fl">🔦 손전등</button></div><div id="sheet"><div></div></div><div id="res"></div><div id="fade"></div><div id="toast"></div><div id="tk"></div>
